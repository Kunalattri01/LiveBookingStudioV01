{% extends 'base/public_base.html' %}
{% load static %}

{% block content %}
<main class="min-h-screen bg-slate-50 pt-28 pb-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
        <div class="mb-8">
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-primary">Flight booking</p>
            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mt-2">Choose your fare</h1>
            <p class="text-sm text-slate-500 mt-2">Select the fare that matches your baggage, flexibility and seat preferences.</p>
        </div>

        <div id="fare-page" class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_340px] gap-6">
            <section id="fare-options" class="space-y-4"></section>

            <aside class="lg:sticky lg:top-28 h-fit bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Your selection</p>
                <div id="fare-summary" class="mt-4 space-y-3"></div>
                <button id="fare-review-button" type="button" disabled class="w-full mt-6 rounded-2xl bg-primary text-white py-3.5 font-bold disabled:opacity-40">
                    Continue & review fare
                </button>
                <p id="fare-error" class="hidden text-sm text-red-600 mt-3"></p>
            </aside>
        </div>
    </div>
</main>

<script>
window.__SELECTED_FLIGHTS__ = {{ selected_flights_json|safe }};
</script>
<script src="{% static 'js/flight-fare.js' %}"></script>
{% endblock %}
