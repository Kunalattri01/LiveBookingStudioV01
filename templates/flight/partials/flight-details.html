{% block extraJs %}
<style>
    .flight-detail-tab {
        padding: 15px 2px;
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
    }

    .flight-detail-tab.active {
        color: #0ea5e9;
        border-color: #0ea5e9;
    }
</style>
{% endblock %}

<div class="bg-white border border-border rounded-2xl overflow-hidden mt-3">

    <!-- TABS -->
    <div class="flex items-center gap-6 px-5 border-b border-border overflow-x-auto">
        <button class="flight-detail-tab active">Flight Details</button>
        <button class="flight-detail-tab">Fare Details</button>
        <button class="flight-detail-tab">Baggage</button>
        <button class="flight-detail-tab">Cancellation</button>
    </div>

    <div class="p-5">
        <!-- FLIGHT TIMELINE -->
        <div class="grid lg:grid-cols-[1fr_280px] gap-8">
            <div>
                <!-- DEPARTURE -->
                <div class="flex gap-4">
                    <div class="flex flex-col items-center">
                        <div class="w-3 h-3 rounded-full bg-primary"></div>
                        <div class="w-px flex-1 bg-slate-200 my-2"></div>
                        <div class="w-3 h-3 rounded-full border-2 border-primary bg-white"></div>
                    </div>

                    <div class="flex-1">
                        <div class="flex justify-between">
                            <div>
                                <p class="font-bold">06:15 · New Delhi</p>
                                <p class="text-xs text-text-secondary mt-1">Indira Gandhi International Airport · Terminal 1</p>
                            </div>
                            <span class="text-xs text-text-secondary"> 28 Aug </span>
                        </div>

                        <div class="py-7">
                            <div class="inline-flex items-center gap-2 px-3 py-2 bg-slate-50 rounded-lg text-xs text-text-secondary">
                                <i class="fa-regular fa-clock"></i>
                                Flight duration · 2h 45m
                            </div>
                        </div>

                        <div class="flex justify-between">
                            <div>
                                <p class="font-bold">09:00 · Bengaluru</p>
                                <p class="text-xs text-text-secondary mt-1">Kempegowda International Airport · Terminal 1</p>
                            </div>
                            <span class="text-xs text-text-secondary"> 28 Aug </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FARE SUMMARY -->
            <div class="bg-slate-50 rounded-xl p-5">
                <p class="text-xs text-text-secondary">SELECTED FARE</p>
                <h3 class="font-bold mt-1">IndiGo Saver</h3>
                <div class="border-t border-border my-4"></div>
                <div class="space-y-3 text-xs">
                    <div class="flex justify-between">
                        <span class="text-text-secondary"> Base fare </span>
                        <span class="font-semibold"> ₹4,890 </span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-text-secondary"> Taxes & fees </span>
                        <span class="font-semibold"> ₹1,355 </span>
                    </div>

                    <div class="border-t border-border pt-3 flex justify-between">
                        <span class="font-bold"> Total </span>
                        <span class="text-lg font-extrabold"> ₹6,245 </span>
                    </div>
                </div>
                <button class="w-full mt-5 py-3 bg-primary text-white rounded-xl text-xs font-bold">SELECT FARE</button>
            </div>
        </div>
    </div>
</div>
